[package]
name = "xdrconf-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
stellar-xdr = { version = "=30.0.0", default-features = false, features = ["std", "base64", "serde", "serde_json", "hex", "type_enum"] }
stellar-strkey = "=1.0.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[[bin]]
name = "scan"
path = "src/scan.rs"

[[bin]]
name = "facts"
path = "src/facts.rs"
